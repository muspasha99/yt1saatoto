name: Shorts Pipeline

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Kanal kodu (coding, zen, vault, chakra, beach, summer, pets, breathe, cosmic, ocean, mediterranean, rain)"
        required: true
        default: "coding"
      count:
        description: "Kaç shorts üretilsin? (1-3)"
        required: true
        default: "3"

jobs:
  run-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu
          ffmpeg -version

      - name: Download fonts
        run: |
          mkdir -p fonts
          BASE="https://github.com/google/fonts/raw/main"

          wget -q -O fonts/SpaceGrotesk-Bold.ttf \
            "$BASE/ofl/spacegrotesk/static/SpaceGrotesk-Bold.ttf" \
            || echo "⚠ SpaceGrotesk indirilemedi"

          wget -q -O fonts/CormorantGaramond-Bold.ttf \
            "$BASE/ofl/cormorantgaramond/CormorantGaramond-Bold.ttf" \
            || echo "⚠ CormorantGaramond indirilemedi"

          wget -q -O fonts/BebasNeue-Regular.ttf \
            "$BASE/ofl/bebasneue/BebasNeue-Regular.ttf" \
            || echo "⚠ BebasNeue indirilemedi"

          wget -q -O fonts/Marcellus-Regular.ttf \
            "$BASE/ofl/marcellus/Marcellus-Regular.ttf" \
            || echo "⚠ Marcellus indirilemedi"

          wget -q -O fonts/Nunito-ExtraBold.ttf \
            "$BASE/ofl/nunito/static/Nunito-ExtraBold.ttf" \
            || echo "⚠ Nunito indirilemedi"

          wget -q -O fonts/Quicksand-Bold.ttf \
            "$BASE/ofl/quicksand/static/Quicksand-Bold.ttf" \
            || echo "⚠ Quicksand indirilemedi"

          echo "Font klasörü:"
          ls -lh fonts/

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Shorts Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_TOKEN_HESAP98: ${{ secrets.DRIVE_TOKEN_HESAP98 }}
          DRIVE_TOKEN_HESAP97: ${{ secrets.DRIVE_TOKEN_HESAP97 }}
          DRIVE_TOKEN_HESAP99: ${{ secrets.DRIVE_TOKEN_HESAP99 }}
          DRIVE_TOKEN_HESAP87: ${{ secrets.DRIVE_TOKEN_HESAP87 }}
          DRIVE_TOKEN_HESAP100: ${{ secrets.DRIVE_TOKEN_HESAP100 }}
          DRIVE_TOKEN_HESAP101: ${{ secrets.DRIVE_TOKEN_HESAP101 }}
          YT_TOKEN_CODING: ${{ secrets.YT_TOKEN_CODING }}
          YT_TOKEN_ZEN: ${{ secrets.YT_TOKEN_ZEN }}
          YT_TOKEN_VAULT: ${{ secrets.YT_TOKEN_VAULT }}
          YT_TOKEN_CHAKRA: ${{ secrets.YT_TOKEN_CHAKRA }}
          YT_TOKEN_BEACH: ${{ secrets.YT_TOKEN_BEACH }}
          YT_TOKEN_SUMMER: ${{ secrets.YT_TOKEN_SUMMER }}
          YT_TOKEN_PETS: ${{ secrets.YT_TOKEN_PETS }}
          YT_TOKEN_BREATHE: ${{ secrets.YT_TOKEN_BREATHE }}
          YT_TOKEN_COSMIC: ${{ secrets.YT_TOKEN_COSMIC }}
          YT_TOKEN_OCEAN: ${{ secrets.YT_TOKEN_OCEAN }}
          YT_TOKEN_MEDITERRANEAN: ${{ secrets.YT_TOKEN_MEDITERRANEAN }}
          YT_TOKEN_RAIN: ${{ secrets.YT_TOKEN_RAIN }}
        run: |
          python main_shorts.py ${{ inputs.channel }} ${{ inputs.count }}
