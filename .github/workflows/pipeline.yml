name: YouTube Pipeline

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Kanal kodu (coding, zen, vault, chakra, beach, summer, pets, breathe)"
        required: true
        default: "coding"
  schedule:
    # Her cron, hedef yayın saatinden ~2 saat öncesi (encoding + gecikme + işleme dahil)
    - cron: "0 1 * * *"   # breathe   → US gece (22:00 EST ertesi gün)
    - cron: "0 9 * * *"   # vault     → US sabah motivasyon (06:00 EST)
    - cron: "0 10 * * *"  # zen, chakra → US sabah meditasyon (07:00 EST)
    - cron: "0 11 * * *"  # pets      → US evden çıkış (08:00 EST)
    - cron: "0 14 * * *"  # beach     → EU Cuma akşam (17:00 CET)
    - cron: "0 15 * * *"  # summer    → EU gün batımı (18:00 CET)
    - cron: "0 16 * * *"  # coding    → US öğleden sonra (13:00 EST)

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        channel: ${{ fromJSON(
          github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.channel)
          || (github.event.schedule == '0 1 * * *' && '["breathe"]'
          || (github.event.schedule == '0 9 * * *' && '["vault"]'
          || (github.event.schedule == '0 10 * * *' && '["zen", "chakra"]'
          || (github.event.schedule == '0 11 * * *' && '["pets"]'
          || (github.event.schedule == '0 14 * * *' && '["beach"]'
          || (github.event.schedule == '0 15 * * *' && '["summer"]'
          || '["coding"]'))))))) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu
          ffmpeg -version

        
      - name: Download fonts
        run: |
          mkdir -p fonts

          wget -q -O fonts/SpaceGrotesk-Bold.ttf \
            "https://github.com/google/fonts/raw/main/ofl/spacegrotesk/static/SpaceGrotesk-Bold.ttf" \
            || echo "⚠ SpaceGrotesk indirilemedi"

          wget -q -O fonts/CormorantGaramond-Bold.ttf \
            "https://github.com/google/fonts/raw/main/ofl/cormorantgaramond/CormorantGaramond-Bold.ttf" \
            || echo "⚠ CormorantGaramond indirilemedi"

          wget -q -O fonts/BebasNeue-Regular.ttf \
            "https://github.com/google/fonts/raw/main/ofl/bebasneue/BebasNeue-Regular.ttf" \
            || echo "⚠ BebasNeue indirilemedi"

          wget -q -O fonts/Marcellus-Regular.ttf \
            "https://github.com/google/fonts/raw/main/ofl/marcellus/Marcellus-Regular.ttf" \
            || echo "⚠ Marcellus indirilemedi"

          wget -q -O fonts/Nunito-ExtraBold.ttf \
            "https://github.com/google/fonts/raw/main/ofl/nunito/static/Nunito-ExtraBold.ttf" \
            || echo "⚠ Nunito indirilemedi"

          wget -q -O fonts/Quicksand-Bold.ttf \
            "https://github.com/google/fonts/raw/main/ofl/quicksand/static/Quicksand-Bold.ttf" \
            || echo "⚠ Quicksand indirilemedi"

          echo "Font klasörü:"
          ls -lh fonts/

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline for channel ${{ matrix.channel }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Drive tokens (4 hesap)
          DRIVE_TOKEN_HESAP98: ${{ secrets.DRIVE_TOKEN_HESAP98 }}
          DRIVE_TOKEN_HESAP97: ${{ secrets.DRIVE_TOKEN_HESAP97 }}
          DRIVE_TOKEN_HESAP99: ${{ secrets.DRIVE_TOKEN_HESAP99 }}
          DRIVE_TOKEN_HESAP87: ${{ secrets.DRIVE_TOKEN_HESAP87 }}
          # YouTube tokens (8 kanal)
          YT_TOKEN_CODING: ${{ secrets.YT_TOKEN_CODING }}
          YT_TOKEN_ZEN: ${{ secrets.YT_TOKEN_ZEN }}
          YT_TOKEN_VAULT: ${{ secrets.YT_TOKEN_VAULT }}
          YT_TOKEN_CHAKRA: ${{ secrets.YT_TOKEN_CHAKRA }}
          YT_TOKEN_BEACH: ${{ secrets.YT_TOKEN_BEACH }}
          YT_TOKEN_SUMMER: ${{ secrets.YT_TOKEN_SUMMER }}
          YT_TOKEN_PETS: ${{ secrets.YT_TOKEN_PETS }}
          YT_TOKEN_BREATHE: ${{ secrets.YT_TOKEN_BREATHE }}
        run: |
          python main.py ${{ matrix.channel }}
