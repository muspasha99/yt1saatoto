name: YouTube Pipeline

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Kanal kodu (coding, zen, vault, chakra, beach, summer, pets, breathe)"
        required: true
        default: "coding"
  schedule:
    # Sabah Batch 02:00 UTC = 05:00 TR
    - cron: "0 1 * * *"   # vault, zen, pets
    # Öğle Batch 09:00 UTC = 12:00 TR
    - cron: "0 8 * * *"   # coding, beach, chakra
    # Akşam Batch 14:00 UTC = 17:00 TR
    - cron: "0 13 * * *"  # summer, breathe

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.channel) || (github.event.schedule == '0 1 * * *' && '["vault", "zen", "pets"]' || (github.event.schedule == '0 8 * * *' && '["coding", "beach", "chakra"]' || '["summer", "breathe"]'))) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu
          ffmpeg -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline for channel ${{ matrix.channel }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Drive tokens (4 hesap)
          DRIVE_TOKEN_HESAP98: ${{ secrets.DRIVE_TOKEN_HESAP98 }}
          DRIVE_TOKEN_HESAP97: ${{ secrets.DRIVE_TOKEN_HESAP97 }}
          DRIVE_TOKEN_HESAP99: ${{ secrets.DRIVE_TOKEN_HESAP99 }}
          DRIVE_TOKEN_HESAP87: ${{ secrets.DRIVE_TOKEN_HESAP87 }}
          # YouTube tokens (8 kanal)
          YT_TOKEN_CODING: ${{ secrets.YT_TOKEN_CODING }}
          YT_TOKEN_ZEN: ${{ secrets.YT_TOKEN_ZEN }}
          YT_TOKEN_VAULT: ${{ secrets.YT_TOKEN_VAULT }}
          YT_TOKEN_CHAKRA: ${{ secrets.YT_TOKEN_CHAKRA }}
          YT_TOKEN_BEACH: ${{ secrets.YT_TOKEN_BEACH }}
          YT_TOKEN_SUMMER: ${{ secrets.YT_TOKEN_SUMMER }}
          YT_TOKEN_PETS: ${{ secrets.YT_TOKEN_PETS }}
          YT_TOKEN_BREATHE: ${{ secrets.YT_TOKEN_BREATHE }}
        run: |
          python main.py ${{ matrix.channel }}
