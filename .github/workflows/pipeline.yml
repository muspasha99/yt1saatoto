name: YouTube Pipeline

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Kanal kodu (coding, zen, vault, chakra, beach, summer, pets, breathe, cosmic, ocean, mediterranean, rain)"
        required: true
        default: "coding"
  schedule:
    # --- GRUP A (tek günler: 1,3,5,...) ---
    - cron: "0 9 * * *"   # vault
    - cron: "0 10 * * *"  # zen, chakra
    - cron: "0 14 * * *"  # beach
    - cron: "0 15 * * *"  # summer
    - cron: "0 16 * * *"  # coding
    # --- GRUP B (çift günler: 2,4,6,...) ---
    - cron: "0 1 * * *"   # breathe
    - cron: "0 2 * * *"   # ocean
    - cron: "0 3 * * *"   # cosmic
    - cron: "0 11 * * *"  # pets
    - cron: "0 13 * * *"  # rain
    - cron: "0 17 * * *"  # mediterranean

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - channel: coding
          - channel: zen
          - channel: vault
          - channel: chakra
          - channel: beach
          - channel: summer
          - channel: pets
          - channel: breathe
          - channel: cosmic
          - channel: ocean
          - channel: mediterranean
          - channel: rain

    steps:
      - name: Check schedule match
        id: check
        run: |
          CHANNEL="${{ matrix.channel }}"
          SCHEDULE="${{ github.event.schedule }}"
          EVENT="${{ github.event_name }}"
          INPUT="${{ inputs.channel }}"

          # Manuel tetiklemede gün filtresi yok — direkt çalıştır
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$CHANNEL" = "$INPUT" ]; then
              echo "run=true" >> $GITHUB_OUTPUT
            else
              echo "run=false" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          # Gün gruplaması
          DAY=$(date +%-d)
          IS_ODD=$((DAY % 2))   # 1 = tek gün (Grup A), 0 = çift gün (Grup B)

          GROUP_A="coding zen vault chakra beach summer"
          GROUP_B="pets breathe cosmic ocean mediterranean rain"

          # Bu kanal bugün çalışmalı mı?
          if echo "$GROUP_A" | grep -qw "$CHANNEL"; then
            [ "$IS_ODD" -eq 0 ] && echo "run=false" >> $GITHUB_OUTPUT && exit 0
          elif echo "$GROUP_B" | grep -qw "$CHANNEL"; then
            [ "$IS_ODD" -eq 1 ] && echo "run=false" >> $GITHUB_OUTPUT && exit 0
          fi

          # Saat eşleşmesi
          case "$SCHEDULE" in
            "0 1 * * *")  [ "$CHANNEL" = "breathe" ]      && echo "run=true" >> $GITHUB_OUTPUT || echo "run=false" >> $GITHUB_OUTPUT ;;
            "0 2 * * *")  [ "$CHANNEL" = "ocean" ]        && echo "run=true" >> $GITHUB_OUTPUT || echo "run=false" >> $GITHUB_OUTPUT ;;
            "0 3 * * *")  [ "$CHANNEL" = "cosmic" ]       && echo "run=true" >> $GITHUB_OUTPUT || echo "run=false" >> $GITHUB_OUTPUT ;;
            "0 9 * * *")  [ "$CHANNEL" = "vault" ]        && echo "run=true" >> $GITHUB_OUTPUT || echo "run=false" >> $GITHUB_OUTPUT ;;
            "0 10 * * *") { [ "$CHANNEL" = "zen" ] || [ "$CHANNEL" = "chakra" ]; } && echo "run=true" >> $GITHUB_OUTPUT || echo "run=false" >> $GITHUB_OUTPUT ;;
            "0 11 * * *") [ "$CHANNEL" = "pets" ]         && echo "run=true" >> $GITHUB_OUTPUT || echo "run=false" >> $GITHUB_OUTPUT ;;
            "0 13 * * *") [ "$CHANNEL" = "rain" ]         && echo "run=true" >> $GITHUB_OUTPUT || echo "run=false" >> $GITHUB_OUTPUT ;;
            "0 14 * * *") [ "$CHANNEL" = "beach" ]        && echo "run=true" >> $GITHUB_OUTPUT || echo "run=false" >> $GITHUB_OUTPUT ;;
            "0 15 * * *") [ "$CHANNEL" = "summer" ]       && echo "run=true" >> $GITHUB_OUTPUT || echo "run=false" >> $GITHUB_OUTPUT ;;
            "0 16 * * *") [ "$CHANNEL" = "coding" ]       && echo "run=true" >> $GITHUB_OUTPUT || echo "run=false" >> $GITHUB_OUTPUT ;;
            "0 17 * * *") [ "$CHANNEL" = "mediterranean" ] && echo "run=true" >> $GITHUB_OUTPUT || echo "run=false" >> $GITHUB_OUTPUT ;;
            *) echo "run=false" >> $GITHUB_OUTPUT ;;
          esac

      - name: Checkout repo
        if: steps.check.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg
        if: steps.check.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-open-sans
          ffmpeg -version

      - name: Download fonts
        if: steps.check.outputs.run == 'true'
        run: |
          mkdir -p fonts

          wget -q -O fonts/SpaceGrotesk-Bold.ttf \
            "https://fonts.gstatic.com/s/spacegrotesk/v16/V8mQoQDjQSkFtoMM3T6r8E7mF71Q-gowFXDTD26GxA.ttf" \
            || cp /usr/share/fonts/truetype/open-sans/OpenSans-Bold.ttf fonts/SpaceGrotesk-Bold.ttf \
            || echo "⚠ SpaceGrotesk indirilemedi"

          wget -q -O fonts/CormorantGaramond-Bold.ttf \
            "https://fonts.gstatic.com/s/cormorantgaramond/v21/co3YmX5slCNuHLi8bLeY9MK7whWMhyjQAllvuQ.ttf" \
            || cp /usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf fonts/CormorantGaramond-Bold.ttf \
            || echo "⚠ CormorantGaramond indirilemedi"

          wget -q -O fonts/BebasNeue-Regular.ttf \
            "https://fonts.gstatic.com/s/bebasneue/v14/JTUSjIg69CK48gW7PXooxW5rygbi49c.ttf" \
            || cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf fonts/BebasNeue-Regular.ttf \
            || echo "⚠ BebasNeue indirilemedi"

          wget -q -O fonts/Marcellus-Regular.ttf \
            "https://fonts.gstatic.com/s/marcellus/v13/wEO_EBrOk8hQLDvIAF8FUfAL3EsHiA.ttf" \
            || cp /usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf fonts/Marcellus-Regular.ttf \
            || echo "⚠ Marcellus indirilemedi"

          wget -q -O fonts/Nunito-ExtraBold.ttf \
            "https://fonts.gstatic.com/s/nunito/v26/XRXI3I6Li01BKofiOc5wtlZ2di8HDIkhdTQ3j6zbXWjgeg.ttf" \
            || cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf fonts/Nunito-ExtraBold.ttf \
            || echo "⚠ Nunito indirilemedi"

          wget -q -O fonts/Quicksand-Bold.ttf \
            "https://fonts.gstatic.com/s/quicksand/v31/6xKtdSZaM9iE8KbpRA_hK1QNYuDyP7bh.ttf" \
            || cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf fonts/Quicksand-Bold.ttf \
            || echo "⚠ Quicksand indirilemedi"

          echo "Font klasörü:"
          ls -lh fonts/

      - name: Install Python dependencies
        if: steps.check.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline for channel ${{ matrix.channel }}
        if: steps.check.outputs.run == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          DRIVE_TOKEN_HESAP98: ${{ secrets.DRIVE_TOKEN_HESAP98 }}
          DRIVE_TOKEN_HESAP97: ${{ secrets.DRIVE_TOKEN_HESAP97 }}
          DRIVE_TOKEN_HESAP99: ${{ secrets.DRIVE_TOKEN_HESAP99 }}
          DRIVE_TOKEN_HESAP87: ${{ secrets.DRIVE_TOKEN_HESAP87 }}
          DRIVE_TOKEN_HESAP100: ${{ secrets.DRIVE_TOKEN_HESAP100 }}
          DRIVE_TOKEN_HESAP101: ${{ secrets.DRIVE_TOKEN_HESAP101 }}
          YT_TOKEN_CODING: ${{ secrets.YT_TOKEN_CODING }}
          YT_TOKEN_ZEN: ${{ secrets.YT_TOKEN_ZEN }}
          YT_TOKEN_VAULT: ${{ secrets.YT_TOKEN_VAULT }}
          YT_TOKEN_CHAKRA: ${{ secrets.YT_TOKEN_CHAKRA }}
          YT_TOKEN_BEACH: ${{ secrets.YT_TOKEN_BEACH }}
          YT_TOKEN_SUMMER: ${{ secrets.YT_TOKEN_SUMMER }}
          YT_TOKEN_PETS: ${{ secrets.YT_TOKEN_PETS }}
          YT_TOKEN_BREATHE: ${{ secrets.YT_TOKEN_BREATHE }}
          YT_TOKEN_COSMIC: ${{ secrets.YT_TOKEN_COSMIC }}
          YT_TOKEN_OCEAN: ${{ secrets.YT_TOKEN_OCEAN }}
          YT_TOKEN_MEDITERRANEAN: ${{ secrets.YT_TOKEN_MEDITERRANEAN }}
          YT_TOKEN_RAIN: ${{ secrets.YT_TOKEN_RAIN }}
        run: |
          python main.py ${{ matrix.channel }}
