name: Keep Alive Workflow

on:
  schedule:
    # Her Pazar gece 00:00 UTC'de çalışır
    - cron: '0 0 * * 0'
  workflow_dispatch: # İstediğiniz zaman manuel de tetikleyebilirsiniz

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Keep-Alive Dosyasını Güncelle
        run: |
          echo "Son canlı tutma güncellemesi: $(date -u)" > keep-alive.txt

      - name: Değişiklikleri Commit Et ve Pushla
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add keep-alive.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: keep-alive ping [skip ci]" && git push)
